<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0d" />
    <title>Plankton · Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Geist, system-ui, sans-serif; background: #0b0c0d; color: #e9ecea; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; }
      main { width: min(440px, calc(100% - 48px)); }
      p { color: #a4aaa6; line-height: 1.7; }
      a { color: #d9e8dc; }
      .mark { color: #8fa896; font-size: 12px; letter-spacing: .18em; }
    </style>
  </head>
  <body>
    <main>
      <span class="mark">PLANKTON</span>
      <h1>You’re offline</h1>
      <p>Reconnect to view current market data and use the trading terminal. The app does not submit or queue trades while offline.</p>
      <a href="/trade">Try again</a>
    </main>
  </body>
</html>
